services:
  app:
    image: ghcr.io/jacobot27/video-to-3d:latest

    # GPU access — requires NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ./checkpoints:/workspace/checkpoints
      - ./inputs:/workspace/inputs
      - ./outputs:/workspace/outputs
      - ./pipeline:/workspace/pipeline
      - ./run.py:/workspace/run.py

    stdin_open: true
    tty: true
    shm_size: '2gb'

    working_dir: /workspace